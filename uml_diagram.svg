    <rect x="30" y="614" width="290" height="221" rx="6" class="enum-body" />
    <path d="M 36,614 H 314 A 6 6 0 0 1 320,620 V 659 H 30 V 620 A 6 6 0 0 1 36,614 Z" class="enum-head" />
    <rect x="30" y="614" width="290" height="221" rx="6" class="enum-border" />
    <text x="175.0" y="633" class="stereo">«enumeration»</text>
    <text x="175.0" y="651" class="enum-name">TokenType</text>
    <line x1="30" y1="659" x2="320" y2="659" class="sep" />
    <text x="42" y="679" class="member">IF, ELSE, WHILE, DO, BREAK,</text>
    <text x="42" y="697" class="member">INT, BOOLEAN, TRUE, FALSE, PRINT,</text>
    <text x="42" y="715" class="member">ID, NUM,</text>
    <text x="42" y="733" class="member">PLUS, MINUS, TIMES, DIVIDE,</text>
    <text x="42" y="751" class="member">EQ, NEQ, LT, LEQ, GT, GEQ,</text>
    <text x="42" y="769" class="member">AND, OR, NOT, ASSIGN,</text>
    <text x="42" y="787" class="member">SEMICOLON, LPAREN, RPAREN, LBRACE,</text>
    <text x="42" y="805" class="member">RBRACE, LBRACKET, RBRACKET,</text>
    <text x="42" y="823" class="member">END_OF_FILE</text>
  </g>
