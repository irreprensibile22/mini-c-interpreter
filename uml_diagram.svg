  <rect width="100%" height="100%" class="bg" />
  <text x="730.0" y="42" class="title">UML Class Diagram — C Subset Interpreter</text>
  <text x="730.0" y="66" class="subtitle">Tokenizer → Parser (syntax + static type checking) → Evaluator (tree-walking execution)</text>
