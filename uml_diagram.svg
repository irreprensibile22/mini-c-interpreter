      .sep { stroke: #cbd5e1; stroke-width: 1.2; }
      .member { font-family: Menlo, Consolas, 'DejaVu Sans Mono', monospace; font-size: 11.5px; fill: #334155; }
      .assoc { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .dep { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 5,4; }
      .gen { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-style: italic; fill: #475569; }
      .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .legend-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
